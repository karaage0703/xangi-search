[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xangi-search"
version = "0.1.0"
description = "Local workspace search service for xangi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24.0",
]

[project.optional-dependencies]
vector = ["sentence-transformers>=3.0.0"]

[project.scripts]
xangi-search = "xangi_search.cli:main"
xangi-search-extension = "xangi_search.extension:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xangi_search"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
