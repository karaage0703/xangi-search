<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xangi search</title>
    <style>
      /* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4
       * genre: modern-minimal · theme: existing xangi · mobile: 320/375/414/768
       */
      :root {
        color-scheme: light dark;
        --surface: #fff;
        --surface-muted: #f7f6f3;
        --surface-subtle: #f1f0ed;
        --ink: #37352f;
        --ink-secondary: #5e5c57;
        --ink-muted: #787774;
        --border: #d8d7d4;
        --hairline: #e3e2df;
        --accent: #2383e2;
        --accent-ink: #155f9f;
        --accent-tint: rgb(35 131 226 / 11%);
        --success: #287a47;
        --success-tint: rgb(40 122 71 / 11%);
        --danger: #d44c47;
        --hover: rgb(55 53 47 / 8%);
        --shadow: 0 18px 48px rgb(55 53 47 / 18%);
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
          sans-serif;
        color: var(--ink);
        background: var(--surface-muted);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #191919;
          --surface-muted: #202020;
          --surface-subtle: #2a2a2a;
          --ink: #efefed;
          --ink-secondary: #c8c7c4;
          --ink-muted: #aaa9a5;
          --border: #40403d;
          --hairline: #333330;
          --accent: #5aa7e8;
          --accent-ink: #8dc6f3;
          --accent-tint: rgb(90 167 232 / 18%);
          --success: #68c68a;
          --success-tint: rgb(104 198 138 / 14%);
          --danger: #ef7771;
          --hover: rgb(255 255 255 / 7%);
          --shadow: 0 18px 48px rgb(0 0 0 / 35%);
        }
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; overflow-x: clip; }
      body { background: var(--surface-muted); }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }

      .shell { width: min(920px, 100%); min-width: 0; margin: 0 auto; padding: 36px 24px 72px; }
      .header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
        padding-bottom: 22px; border-bottom: 1px solid var(--hairline); }
      .header-main { min-width: 0; }
      .back-link { display: inline-flex; min-height: 40px; align-items: center; margin: 0 0 10px;
        color: var(--accent-ink); font-size: 13px; font-weight: 700; text-decoration: none; }
      .back-link:hover { text-decoration: underline; text-underline-offset: 3px; }
      .kicker { margin: 0 0 7px; color: var(--accent-ink); font-size: 11px; font-weight: 750;
        letter-spacing: .08em; text-transform: uppercase; }
      h1 { min-width: 0; margin: 0; font-size: clamp(27px, 5vw, 38px); line-height: 1.1;
        overflow-wrap: anywhere; }
      .subtitle { max-width: 620px; margin: 10px 0 0; color: var(--ink-secondary); font-size: 14px;
        line-height: 1.65; }
      .header-actions { display: flex; align-items: center; gap: 9px; }
      .status { display: inline-flex; min-height: 30px; align-items: center; gap: 7px; border: 1px solid var(--border);
        border-radius: 999px; padding: 4px 10px; color: var(--ink-secondary); background: var(--surface); font-size: 12px; white-space: nowrap; }
      .status::before { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-muted); content: ""; }
      .status.ready::before { background: var(--success); }
      .status.indexing::before { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }

      .button { min-height: 42px; border: 1px solid var(--border); border-radius: 7px; padding: 8px 14px;
        color: var(--ink-secondary); background: var(--surface); font-size: 13px; font-weight: 680; cursor: pointer; white-space: nowrap; }
      .button.primary { border-color: var(--accent); color: var(--surface); background: var(--accent); }
      .button:hover:not(:disabled) { color: var(--ink); background: var(--hover); }
      .button.primary:hover:not(:disabled) { color: var(--surface); background: var(--accent-ink); }
      .button:active:not(:disabled) { transform: translateY(1px); }
      .button:disabled { cursor: wait; opacity: .55; }

      .search-panel { margin-top: 24px; }
      .search-box { position: relative; }
      .search-input { width: 100%; min-height: 56px; border: 1px solid var(--border); border-radius: 10px;
        padding: 13px 48px 13px 17px; color: var(--ink); background: var(--surface); font-size: 17px;
        box-shadow: 0 1px 1px rgb(55 53 47 / 4%); }
      .search-input::placeholder { color: var(--ink-muted); }
      .search-input:focus { border-color: var(--accent); }
      .clear { position: absolute; top: 7px; right: 7px; width: 42px; height: 42px; border: 0;
        border-radius: 7px; color: var(--ink-muted); background: transparent; font-size: 20px; cursor: pointer; }
      .clear:hover { color: var(--ink); background: var(--hover); }
      .search-meta { display: flex; min-height: 38px; align-items: center; justify-content: space-between; gap: 12px;
        padding: 8px 2px 0; color: var(--ink-muted); font-size: 12px; }
      .search-meta p { margin: 0; }
      .error { margin: 16px 0 0; border: 1px solid var(--danger); border-radius: 8px; padding: 12px 14px;
        color: var(--danger); background: var(--surface); font-size: 13px; }

      .results { display: grid; gap: 11px; margin-top: 12px; }
      .result { min-width: 0; border: 1px solid var(--border); border-radius: 9px; padding: 18px;
        background: var(--surface); }
      .result-link { display: block; min-width: 0; color: var(--accent-ink); font-size: 14px; font-weight: 700;
        line-height: 1.45; overflow-wrap: anywhere; text-decoration: none; }
      .result-link:hover { text-decoration: underline; text-underline-offset: 3px; }
      .result-score { margin: 8px 0 0; color: var(--ink-muted); font-size: 11px; line-height: 1.4; }
      .result-snippet { display: -webkit-box; margin: 9px 0 0; overflow: hidden; color: var(--ink-secondary);
        font-size: 13px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere;
        -webkit-box-orient: vertical; -webkit-line-clamp: 4; }
      .empty { margin-top: 12px; border: 1px dashed var(--border); border-radius: 9px; padding: 30px 18px;
        color: var(--ink-secondary); background: var(--surface); text-align: center; }
      .empty h2 { margin: 0; font-size: 16px; }
      .empty p { margin: 7px 0 0; font-size: 13px; line-height: 1.6; }

      dialog { width: min(620px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); border: 1px solid var(--border);
        border-radius: 12px; padding: 0; color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
      dialog::backdrop { background: rgb(15 15 15 / 38%); }
      .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 16px;
        border-bottom: 1px solid var(--hairline); padding: 18px 20px; }
      .dialog-head h2 { margin: 0; font-size: 18px; }
      .icon-button { width: 40px; height: 40px; border: 0; border-radius: 7px; color: var(--ink-secondary);
        background: transparent; font-size: 21px; cursor: pointer; }
      .icon-button:hover { color: var(--ink); background: var(--hover); }
      .settings-form { display: grid; gap: 19px; max-height: calc(100dvh - 168px); overflow-y: auto; padding: 20px; }
      .field { display: grid; gap: 7px; }
      .field > span, .switch-copy strong { font-size: 13px; font-weight: 700; }
      .field small, .switch-copy small { color: var(--ink-muted); font-size: 11px; line-height: 1.5; }
      .field input, .field select { width: 100%; min-height: 42px; border: 1px solid var(--border); border-radius: 7px;
        padding: 8px 10px; color: var(--ink); background: var(--surface); }
      .weight-fieldset { min-width: 0; margin: 0; border: 1px solid var(--border); border-radius: 8px;
        padding: 14px; }
      .weight-fieldset legend { padding: 0 5px; font-size: 13px; font-weight: 700; }
      .weight-help { margin: 0 0 11px; color: var(--ink-muted); font-size: 11px; line-height: 1.5; }
      .weight-list { display: grid; gap: 8px; }
      .weight-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 40px; gap: 7px; align-items: center; }
      .weight-row input { width: 100%; min-width: 0; min-height: 40px; border: 1px solid var(--border);
        border-radius: 7px; padding: 7px 9px; color: var(--ink); background: var(--surface); }
      .weight-input { display: grid; gap: 3px; min-width: 0; }
      .weight-warning { color: var(--danger); font-size: 11px; line-height: 1.35; }
      .weight-remove { width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 7px;
        color: var(--ink-muted); background: var(--surface); cursor: pointer; }
      .weight-remove:hover { color: var(--danger); background: var(--hover); }
      .weight-add { margin-top: 10px; }
      .switch { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 11px; align-items: start; }
      .switch input { width: 19px; height: 19px; margin: 1px 0 0; accent-color: var(--accent); }
      .switch-copy { display: grid; gap: 3px; }
      .index-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: var(--surface-muted); }
      .index-card p { margin: 0 0 11px; color: var(--ink-secondary); font-size: 12px; line-height: 1.55; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; border-top: 1px solid var(--hairline);
        padding: 15px 20px; }

      @media (max-width: 620px) {
        .shell { padding: 22px 14px 52px; }
        .header { align-items: flex-start; flex-direction: column; gap: 15px; }
        .header-actions { width: 100%; justify-content: space-between; }
        .status { min-width: 0; }
        .search-input { min-height: 52px; font-size: 16px; }
        .search-meta { align-items: flex-start; flex-direction: column; gap: 3px; }
        .result { padding: 15px; }
        .weight-row { grid-template-columns: minmax(0, 1fr) 72px 40px; }
        .dialog-actions .button { flex: 1; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="header-main">
          <a class="back-link" id="xangiHomeLink" href="/" hidden>← xangiへ戻る</a>
          <p class="kicker">XANGI SEARCH</p>
          <h1>xangi search</h1>
          <p class="subtitle">入力に合わせて、ワークスペース内の関連ファイルをローカルで検索します。</p>
        </div>
        <div class="header-actions">
          <span class="status" id="status">接続確認中</span>
          <button class="button" id="settingsButton" type="button">設定</button>
        </div>
      </header>

      <section class="search-panel" aria-label="ワークスペース検索">
        <div class="search-box">
          <input class="search-input" id="query" type="search" autocomplete="off"
            placeholder="キーワードや探したい内容を入力" aria-label="検索語" />
          <button class="clear" id="clearButton" type="button" aria-label="検索語を消去">×</button>
        </div>
        <div class="search-meta" aria-live="polite">
          <p id="summary">検索語を入力してください</p>
          <p id="modeSummary"></p>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <div class="results" id="results"></div>
        <div class="empty" id="empty">
          <h2>ワークスペースを検索</h2>
          <p>文章の意味とキーワードを組み合わせて、ファイル単位で表示します。</p>
        </div>
      </section>
    </main>

    <dialog id="settingsDialog">
      <div class="dialog-head">
        <h2>検索とindexの設定</h2>
        <button class="icon-button" id="closeSettings" type="button" aria-label="閉じる">×</button>
      </div>
      <form class="settings-form" id="settingsForm">
        <label class="field"><span>検索方式</span>
          <select name="mode"><option value="hybrid">Hybrid</option><option value="vector">Vector</option><option value="keyword">Keyword</option></select>
          <small>通常は意味検索とキーワード検索を組み合わせるHybridがおすすめです。</small>
        </label>
        <label class="field"><span>表示件数</span><input name="limit" type="number" min="1" max="30" /></label>
        <label class="field"><span>最低関連度</span><input name="min_score" type="number" min="0" max="1" step="0.05" />
          <small>0で候補を広く表示し、数値を上げるほど結果を絞ります。</small>
        </label>
        <fieldset class="weight-fieldset">
          <legend>ディレクトリごとの重み</legend>
          <p class="weight-help">ワークスペースからの相対パスと倍率です。長く一致するパスを優先します。</p>
          <div class="weight-list" id="pathWeights"></div>
          <button class="button weight-add" id="addPathWeight" type="button">重みを追加</button>
        </fieldset>
        <label class="field"><span>その他のディレクトリの重み</span>
          <input name="default_path_weight" type="number" min="0" max="10" step="0.1" />
        </label>
        <label class="switch"><input name="forgetting" type="checkbox" />
          <span class="switch-copy"><strong>時間減衰を使う</strong><small>古い記録の順位を下げ、参照した記録を徐々に残りやすくします。</small></span>
        </label>
        <label class="switch"><input name="auto_reindex" type="checkbox" />
          <span class="switch-copy"><strong>自動indexを有効にする</strong><small>変更ファイルだけを定期的に更新します。</small></span>
        </label>
        <label class="field"><span>更新間隔（分）</span><input name="interval_minutes" type="number" min="1" max="1440" /></label>
        <div class="index-card">
          <p id="indexDetail">index状態を確認しています…</p>
          <button class="button" id="reindexButton" type="button">今すぐ更新</button>
        </div>
        <p class="error" id="settingsError" role="alert" hidden></p>
      </form>
      <div class="dialog-actions">
        <button class="button" id="cancelSettings" type="button">キャンセル</button>
        <button class="button primary" id="saveSettings" type="submit" form="settingsForm">保存</button>
      </div>
    </dialog>

    <script>
      const proxyMatch = location.pathname.match(/^\/api\/extensions\/([^/]+)\/ui/);
      const apiBase = proxyMatch ? `/api/extensions/${encodeURIComponent(proxyMatch[1])}/service` : '';
      const endpoint = (path) => `${apiBase}${path}`;
      const $ = (id) => document.getElementById(id);
      const state = { settings: null, health: null, timer: 0, controller: null };
      $('xangiHomeLink').hidden = !proxyMatch;

      async function json(path, options) {
        const response = await fetch(endpoint(path), options);
        const text = await response.text();
        let payload = {};
        try { payload = text ? JSON.parse(text) : {}; } catch { payload = { error: text }; }
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        return payload;
      }

      function setError(target, message) {
        target.textContent = message || '';
        target.hidden = !message;
      }

      function updateModeSummary() {
        if (!state.settings) return;
        $('modeSummary').textContent = `${state.settings.mode} · 最大${state.settings.limit}件 · 関連度${state.settings.min_score}`;
      }

      function updateHealth(health) {
        state.health = health;
        const status = $('status');
        status.className = 'status';
        if (health.reindex_in_progress) {
          status.classList.add('indexing'); status.textContent = 'index更新中';
        } else if (health.last_reindex_error) {
          status.textContent = 'indexエラー';
        } else if (health.initial_index_complete) {
          status.classList.add('ready'); status.textContent = '利用可能';
        } else {
          status.textContent = '初回index待ち';
        }
        const last = health.last_reindex ? new Date(health.last_reindex).toLocaleString() : '未完了';
        $('indexDetail').textContent = `${health.files}ファイル・${health.chunks}チャンク。最終更新: ${last}`;
        $('reindexButton').disabled = Boolean(health.reindex_in_progress);
        $('reindexButton').textContent = health.reindex_in_progress ? '更新中…' : '今すぐ更新';
      }

      async function refreshHealth() {
        try { updateHealth(await json('/health')); } catch (cause) {
          const status = $('status'); status.className = 'status'; status.textContent = '接続できません';
        }
      }

      function resultLink(path) {
        if (proxyMatch) return `/workspace?path=${encodeURIComponent(path)}`;
        return endpoint(`/file?path=${encodeURIComponent(path)}`);
      }

      function renderResults(payload) {
        const container = $('results');
        container.replaceChildren();
        $('empty').hidden = payload.count > 0;
        $('summary').textContent = `${payload.count}ファイル · ${payload.elapsed_ms}ms`;
        for (const item of payload.results) {
          const article = document.createElement('article'); article.className = 'result';
          const link = document.createElement('a'); link.className = 'result-link';
          link.href = resultLink(item.file_path); link.textContent = item.file_path;
          if (!proxyMatch) { link.target = '_blank'; link.rel = 'noopener'; }
          const score = document.createElement('p'); score.className = 'result-score';
          score.textContent = `関連度 ${Number(item.score).toFixed(2)}`;
          const snippet = document.createElement('p'); snippet.className = 'result-snippet';
          snippet.textContent = item.content;
          article.append(link, score, snippet); container.append(article);
        }
        if (payload.count === 0) {
          $('empty').querySelector('h2').textContent = '該当するファイルがありません';
          $('empty').querySelector('p').textContent = '短いキーワードにするか、最低関連度を下げてください。';
        }
      }

      async function searchNow() {
        const query = $('query').value.trim();
        state.controller?.abort();
        if (!query) {
          $('results').replaceChildren(); $('empty').hidden = false;
          $('empty').querySelector('h2').textContent = 'ワークスペースを検索';
          $('empty').querySelector('p').textContent = '文章の意味とキーワードを組み合わせて、ファイル単位で表示します。';
          $('summary').textContent = '検索語を入力してください'; setError($('error'), ''); return;
        }
        const controller = new AbortController(); state.controller = controller;
        $('summary').textContent = '検索中…'; setError($('error'), '');
        const url = new URL(location.href); url.searchParams.set('q', query); history.replaceState(null, '', url);
        try {
          const payload = await json(`/search?q=${encodeURIComponent(query)}`, { signal: controller.signal });
          if (state.controller === controller) renderResults(payload);
        } catch (cause) {
          if (cause.name !== 'AbortError') setError($('error'), cause.message || String(cause));
        }
      }

      function scheduleSearch() {
        clearTimeout(state.timer); state.timer = setTimeout(searchNow, 220);
      }

      function populateSettings(settings) {
        state.settings = settings; const form = $('settingsForm');
        form.elements.mode.value = settings.mode;
        form.elements.limit.value = settings.limit;
        form.elements.min_score.value = settings.min_score;
        form.elements.auto_reindex.checked = settings.auto_reindex;
        form.elements.interval_minutes.value = Math.round(settings.reindex_interval_seconds / 60);
        form.elements.default_path_weight.value = settings.default_path_weight;
        form.elements.forgetting.checked = settings.forgetting;
        renderPathWeights(settings.path_weights, settings.path_weight_exists);
        updateModeSummary();
      }

      function addPathWeightRow(prefix = '', weight = 1, exists = null) {
        const row = document.createElement('div'); row.className = 'weight-row';
        const pathField = document.createElement('div'); pathField.className = 'weight-input';
        const pathInput = document.createElement('input'); pathInput.type = 'text';
        pathInput.className = 'weight-path'; pathInput.value = prefix;
        pathInput.placeholder = '例: notes/'; pathInput.setAttribute('aria-label', 'ディレクトリ');
        pathField.append(pathInput);
        if (exists === false) {
          const warning = document.createElement('small'); warning.className = 'weight-warning';
          warning.textContent = '現在のワークスペースに存在しません'; pathField.append(warning);
        }
        const weightInput = document.createElement('input'); weightInput.type = 'number';
        weightInput.className = 'weight-value'; weightInput.min = '0'; weightInput.max = '10';
        weightInput.step = '0.1'; weightInput.value = String(weight);
        weightInput.setAttribute('aria-label', '重み');
        const remove = document.createElement('button'); remove.type = 'button';
        remove.className = 'weight-remove'; remove.textContent = '×';
        remove.setAttribute('aria-label', `${prefix || '新しいディレクトリ'}の重みを削除`);
        remove.addEventListener('click', () => row.remove());
        row.append(pathField, weightInput, remove); $('pathWeights').append(row);
      }

      function renderPathWeights(pathWeights, pathExists = {}) {
        $('pathWeights').replaceChildren();
        for (const [prefix, weight] of Object.entries(pathWeights || {})) {
          addPathWeightRow(prefix, weight, pathExists[prefix]);
        }
      }

      function collectPathWeights() {
        const result = {};
        for (const row of $('pathWeights').querySelectorAll('.weight-row')) {
          const prefix = row.querySelector('.weight-path').value.trim();
          const weight = Number(row.querySelector('.weight-value').value);
          if (!prefix) throw new Error('ディレクトリが空の重み設定があります');
          if (Object.hasOwn(result, prefix)) throw new Error(`ディレクトリが重複しています: ${prefix}`);
          result[prefix] = weight;
        }
        return result;
      }

      async function loadSettings() { populateSettings(await json('/settings')); }

      $('query').addEventListener('input', scheduleSearch);
      $('clearButton').addEventListener('click', () => { $('query').value = ''; $('query').focus(); searchNow(); });
      $('settingsButton').addEventListener('click', () => { setError($('settingsError'), ''); $('settingsDialog').showModal(); });
      $('addPathWeight').addEventListener('click', () => addPathWeightRow());
      $('closeSettings').addEventListener('click', () => $('settingsDialog').close());
      $('cancelSettings').addEventListener('click', () => { populateSettings(state.settings); $('settingsDialog').close(); });
      $('settingsForm').addEventListener('submit', async (event) => {
        event.preventDefault(); const form = event.currentTarget; $('saveSettings').disabled = true;
        setError($('settingsError'), '');
        try {
          const settings = await json('/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: form.elements.mode.value, limit: Number(form.elements.limit.value),
              min_score: Number(form.elements.min_score.value), auto_reindex: form.elements.auto_reindex.checked,
              reindex_interval_seconds: Number(form.elements.interval_minutes.value) * 60,
              path_weights: collectPathWeights(),
              default_path_weight: Number(form.elements.default_path_weight.value),
              forgetting: form.elements.forgetting.checked }) });
          populateSettings(settings); $('settingsDialog').close(); searchNow();
        } catch (cause) { setError($('settingsError'), cause.message || String(cause)); }
        finally { $('saveSettings').disabled = false; }
      });
      $('reindexButton').addEventListener('click', async () => {
        $('reindexButton').disabled = true; setError($('settingsError'), '');
        try { await json('/reindex', { method: 'POST' }); await refreshHealth(); }
        catch (cause) { setError($('settingsError'), cause.message || String(cause)); }
      });

      Promise.all([loadSettings(), refreshHealth()]).then(() => {
        const initial = new URL(location.href).searchParams.get('q') || '';
        $('query').value = initial; if (initial) searchNow();
      }).catch((cause) => setError($('error'), cause.message || String(cause)));
      setInterval(refreshHealth, 5000);
    </script>
  </body>
</html>
